name: Test Docker Compose

on:
  push:
    branches:
      - master
  pull_request:
    types:
      - opened
      - synchronize

jobs:

  test-docker-compose:
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: local
      DOMAIN: localhost
      STACK_NAME: openwisdom-test
      PROJECT_NAME: ${{ vars.PROJECT_NAME }}
      FRONTEND_HOST: http://localhost:5173
      BACKEND_CORS_ORIGINS: http://localhost,http://localhost:5173
      SECRET_KEY: test-secret-key-min-32-chars-long-for-ci
      FIRST_SUPERUSER: admin@example.com
      FIRST_SUPERUSER_PASSWORD: testpassword123
      SMTP_HOST:
      SMTP_USER:
      SMTP_PASSWORD:
      SMTP_PORT: ${{ vars.SMTP_PORT }}
      SMTP_TLS: True
      SMTP_SSL: False
      EMAILS_FROM_EMAIL: test@example.com
      POSTGRES_SERVER: db
      POSTGRES_PORT: ${{ vars.POSTGRES_PORT }}
      POSTGRES_DB: ${{ vars.POSTGRES_DB }}
      POSTGRES_USER: ${{ vars.POSTGRES_USER }}
      POSTGRES_PASSWORD: test-postgres-password
      SENTRY_DSN:
      DOCKER_IMAGE_BACKEND: ${{ vars.DOCKER_IMAGE_BACKEND }}
      DOCKER_IMAGE_FRONTEND: ${{ vars.DOCKER_IMAGE_FRONTEND }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - run: docker compose build
      - run: docker compose down -v --remove-orphans
      - run: docker compose up -d --wait backend frontend adminer
      - name: Test backend is up
        run: curl http://localhost:8000/api/v1/utils/health-check
      - name: Test frontend is up
        run: curl http://localhost:5173
      - run: docker compose down -v --remove-orphans
