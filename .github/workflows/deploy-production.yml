name: Deploy to Production

on:
  release:
    types:
      - published

jobs:
  deploy:
    # Do not deploy in the main repository, only in user projects
    if: github.repository_owner != 'fastapi'
    runs-on:
      - self-hosted
      - production
    env:
      ENVIRONMENT: production
      DOMAIN: ${{ secrets.DOMAIN_PRODUCTION }}
      STACK_NAME: ${{ secrets.STACK_NAME_PRODUCTION }}
      PROJECT_NAME: ${{ secrets.PROJECT_NAME }}
      FRONTEND_HOST: https://dashboard.${{ secrets.DOMAIN_PRODUCTION }}
      BACKEND_CORS_ORIGINS: ${{ secrets.BACKEND_CORS_ORIGINS }}
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      FIRST_SUPERUSER: ${{ secrets.FIRST_SUPERUSER }}
      FIRST_SUPERUSER_PASSWORD: ${{ secrets.FIRST_SUPERUSER_PASSWORD }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_TLS: ${{ secrets.SMTP_TLS }}
      SMTP_SSL: ${{ secrets.SMTP_SSL }}
      EMAILS_FROM_EMAIL: ${{ secrets.EMAILS_FROM_EMAIL }}
      POSTGRES_SERVER: db
      POSTGRES_PORT: ${{ secrets.POSTGRES_PORT }}
      POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
      POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
      DOCKER_IMAGE_BACKEND: ${{ secrets.DOCKER_IMAGE_BACKEND }}
      DOCKER_IMAGE_FRONTEND: ${{ secrets.DOCKER_IMAGE_FRONTEND }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Create .env file
        run: |
          cat > .env <<EOF
          ENVIRONMENT=$ENVIRONMENT
          DOMAIN=$DOMAIN
          STACK_NAME=$STACK_NAME
          PROJECT_NAME=$PROJECT_NAME
          FRONTEND_HOST=$FRONTEND_HOST
          BACKEND_CORS_ORIGINS=$BACKEND_CORS_ORIGINS
          SECRET_KEY=$SECRET_KEY
          FIRST_SUPERUSER=$FIRST_SUPERUSER
          FIRST_SUPERUSER_PASSWORD=$FIRST_SUPERUSER_PASSWORD
          SMTP_HOST=$SMTP_HOST
          SMTP_USER=$SMTP_USER
          SMTP_PASSWORD=$SMTP_PASSWORD
          SMTP_PORT=$SMTP_PORT
          SMTP_TLS=$SMTP_TLS
          SMTP_SSL=$SMTP_SSL
          EMAILS_FROM_EMAIL=$EMAILS_FROM_EMAIL
          POSTGRES_SERVER=$POSTGRES_SERVER
          POSTGRES_PORT=$POSTGRES_PORT
          POSTGRES_DB=$POSTGRES_DB
          POSTGRES_USER=$POSTGRES_USER
          POSTGRES_PASSWORD=$POSTGRES_PASSWORD
          SENTRY_DSN=$SENTRY_DSN
          DOCKER_IMAGE_BACKEND=$DOCKER_IMAGE_BACKEND
          DOCKER_IMAGE_FRONTEND=$DOCKER_IMAGE_FRONTEND
          EOF
      - name: Build containers
        run: docker compose -f docker-compose.yml --project-name "$STACK_NAME" build
      - name: Start containers
        run: docker compose -f docker-compose.yml --project-name "$STACK_NAME" up -d
