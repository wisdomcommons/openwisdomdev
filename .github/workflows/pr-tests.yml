name: PR Tests

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

jobs:
  # Backend linting job
  backend-lint:
    name: Backend Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.4.15"
          enable-cache: true
      - name: Run linter
        run: uv run bash scripts/lint.sh
        working-directory: backend

  # Frontend linting job
  frontend-lint:
    name: Frontend Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: frontend
      - name: Run linter
        run: npm run lint
        working-directory: frontend
      - name: TypeScript check
        run: npm run build
        working-directory: frontend

  # Backend tests job
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: local
      DOMAIN: localhost
      STACK_NAME: openwisdom-test
      PROJECT_NAME: ${{ vars.PROJECT_NAME }}
      FRONTEND_HOST: http://localhost:5173
      BACKEND_CORS_ORIGINS: http://localhost,http://localhost:5173
      SECRET_KEY: test-secret-key-min-32-chars-long-for-ci
      FIRST_SUPERUSER: admin@example.com
      FIRST_SUPERUSER_PASSWORD: testpassword123
      SMTP_HOST:
      SMTP_USER:
      SMTP_PASSWORD:
      SMTP_PORT: ${{ vars.SMTP_PORT }}
      SMTP_TLS: True
      SMTP_SSL: False
      EMAILS_FROM_EMAIL: test@example.com
      POSTGRES_SERVER: localhost
      POSTGRES_PORT: ${{ vars.POSTGRES_PORT }}
      POSTGRES_DB: ${{ vars.POSTGRES_DB }}
      POSTGRES_USER: ${{ vars.POSTGRES_USER }}
      POSTGRES_PASSWORD: test-postgres-password
      SENTRY_DSN:
      DOCKER_IMAGE_BACKEND: ${{ vars.DOCKER_IMAGE_BACKEND }}
      DOCKER_IMAGE_FRONTEND: ${{ vars.DOCKER_IMAGE_FRONTEND }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.4.15"
          enable-cache: true
      - name: Stop any running containers
        run: docker compose down -v --remove-orphans
      - name: Start database services
        run: docker compose up -d db mailcatcher
      - name: Migrate DB
        run: uv run bash scripts/prestart.sh
        working-directory: backend
      - name: Run tests
        run: uv run bash scripts/tests-start.sh "Coverage for $GITHUB_SHA"
        working-directory: backend
        env:
          GITHUB_SHA: ${{ github.sha }}
      - name: Stop containers
        run: docker compose down -v --remove-orphans
      - name: Store coverage files
        uses: actions/upload-artifact@v5
        with:
          name: coverage-html
          path: backend/htmlcov
          include-hidden-files: true

  # Playwright E2E tests
  e2e-tests:
    name: E2E Tests
    needs:
      - backend-lint
      - frontend-lint
      - backend-tests
    timeout-minutes: 60
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: local
      DOMAIN: localhost
      STACK_NAME: openwisdom-test
      PROJECT_NAME: ${{ vars.PROJECT_NAME }}
      FRONTEND_HOST: http://localhost:5173
      BACKEND_CORS_ORIGINS: http://localhost,http://localhost:5173
      SECRET_KEY: test-secret-key-min-32-chars-long-for-ci
      FIRST_SUPERUSER: admin@example.com
      FIRST_SUPERUSER_PASSWORD: testpassword123
      SMTP_HOST:
      SMTP_USER:
      SMTP_PASSWORD:
      SMTP_PORT: ${{ vars.SMTP_PORT }}
      SMTP_TLS: True
      SMTP_SSL: False
      EMAILS_FROM_EMAIL: test@example.com
      POSTGRES_SERVER: db
      POSTGRES_PORT: ${{ vars.POSTGRES_PORT }}
      POSTGRES_DB: ${{ vars.POSTGRES_DB }}
      POSTGRES_USER: ${{ vars.POSTGRES_USER }}
      POSTGRES_PASSWORD: test-postgres-password
      SENTRY_DSN:
      DOCKER_IMAGE_BACKEND: ${{ vars.DOCKER_IMAGE_BACKEND }}
      DOCKER_IMAGE_FRONTEND: ${{ vars.DOCKER_IMAGE_FRONTEND }}
    strategy:
      matrix:
        shardIndex: [1, 2, 3, 4]
        shardTotal: [4]
      fail-fast: false
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.4.15"
          enable-cache: true
      - name: Install backend dependencies
        run: uv sync
        working-directory: backend
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: Generate API client
        run: uv run bash scripts/generate-client.sh
        env:
          VIRTUAL_ENV: backend/.venv
      - name: Build containers
        run: docker compose build
      - name: Stop any running containers
        run: docker compose down -v --remove-orphans
      - name: Run Playwright tests
        run: docker compose run --rm playwright npx playwright test --fail-on-flaky-tests --trace=retain-on-failure --shard="${{ matrix.shardIndex }}/${{ matrix.shardTotal }}"
        env:
          SHARD_INDEX: ${{ matrix.shardIndex }}
          SHARD_TOTAL: ${{ matrix.shardTotal }}
      - name: Stop containers
        run: docker compose down -v --remove-orphans
      - name: Upload blob report to GitHub Actions Artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: blob-report-${{ matrix.shardIndex }}
          path: frontend/blob-report
          include-hidden-files: true
          retention-days: 1

  # Merge Playwright reports
  merge-e2e-reports:
    name: Merge E2E Reports
    needs: e2e-tests
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
      - name: Install dependencies
        run: npm ci
        working-directory: frontend
      - name: Download blob reports from GitHub Actions Artifacts
        uses: actions/download-artifact@v6
        with:
          path: frontend/all-blob-reports
          pattern: blob-report-*
          merge-multiple: true
      - name: Merge into HTML Report
        run: npx playwright merge-reports --reporter html ./all-blob-reports
        working-directory: frontend
      - name: Upload HTML report
        uses: actions/upload-artifact@v5
        with:
          name: html-report--attempt-${{ github.run_attempt }}
          path: frontend/playwright-report
          retention-days: 30
          include-hidden-files: true

  # All tests must pass for this job to succeed
  all-tests-pass:
    name: All Tests Pass
    if: always()
    needs:
      - backend-lint
      - frontend-lint
      - backend-tests
      - e2e-tests
    runs-on: ubuntu-latest
    steps:
      - name: Decide whether all needed jobs succeeded or failed
        uses: re-actors/alls-green@release/v1
        with:
          jobs: ${{ toJSON(needs) }}
